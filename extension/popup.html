<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Bridge Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { width: 300px; background: #0b0f19; color: #f1f5f9; padding: 16px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }
    .brand-icon { font-size: 20px; }
    .title { font-size: 15px; font-weight: 700; color: #60a5fa; }
    .subtitle { font-size: 11px; color: #94a3b8; }
    .status-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
    .row:last-child { margin-bottom: 0; }
    .label { color: #94a3b8; }
    .val { font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.red { background: #ef4444; }
    .btn-open { display: block; width: 100%; text-align: center; text-decoration: none; background: #2563eb; color: #fff; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 6px; transition: background 0.2s; }
    .btn-open:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-icon">⚡</div>
    <div>
      <div class="title">AI Bridge</div>
      <div class="subtitle">Universal Web LLM Connector</div>
    </div>
  </div>

  <div class="status-card">
    <div class="row">
      <span class="label">Bridge Server:</span>
      <span class="val" id="server-status"><span class="dot red" id="server-dot"></span> Checking...</span>
    </div>
    <div class="row">
      <span class="label">Active Tab:</span>
      <span class="val" id="tab-status" style="max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Detecting...</span>
    </div>
  </div>

  <a href="http://localhost:3388" target="_blank" class="btn-open">Open Mission Control 🚀</a>

  <script src="popup.js"></script>
</body>
</html>
